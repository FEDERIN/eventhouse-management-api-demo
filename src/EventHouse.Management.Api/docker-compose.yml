services:
  postgres:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    container_name: core-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - MANAGEMENT_DB=${MANAGEMENT_DB}
      - IDEMPOTENCY_DB=${IDEMPOTENCY_DB}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - otel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: core-redis
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - otel-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
  eventhouse-api:
    build:
      context: ../..
      dockerfile: src/EventHouse.Management.Api/Dockerfile
    container_name: eventhouse-management-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Auth__Issuer=${Auth__Issuer:?Auth__Issuer must be set}
      - Auth__Audience=${Auth__Audience:?Auth__Audience must be set}
      - Auth__DevSecret=${Auth__DevSecret:?Auth__DevSecret must be set}
      - MEDIATR_LICENSE_KEY=${MEDIATR_LICENSE_KEY:-}
      
      # OpenTelemetry
      # localhost inside the API container is not the host machine. Use the
      # Compose service name to reach the collector on the shared network.
      - OpenTelemetry__Tracing__OtlpEndpoint=http://otel-collector:4317
      - OpenTelemetry__Metrics__OtlpEndpoint=http://otel-collector:4317
      - OpenTelemetry__Logging__OtlpEndpoint=http://otel-collector:4317
      - OpenTelemetry__Metrics__Enabled=${OpenTelemetry__Metrics__Enabled}
      - OpenTelemetry__Tracing__Enabled=${OpenTelemetry__Tracing__Enabled}
      - OpenTelemetry__Logging__Enabled=${OpenTelemetry__Logging__Enabled}
      - OpenTelemetry__Metrics__Meters__1=Npgsql

      # Core System idempotency configuration
      - Core__Cache__Provider=${Core__Cache__Provider}
      - Core__Cache__InstanceName=${Core__Cache__InstanceName}
      - Core__Idempotency__Provider=${Core__Idempotency__Provider}
      - Core__Idempotency__Enabled=${Core__Idempotency__Enabled}
      - Core__Idempotency__HeaderName=${Core__Idempotency__HeaderName}
      - Core__Idempotency__Expiration=${Core__Idempotency__Expiration}
      - Core__RateLimiting__PermitLimit=${Core__RateLimiting__PermitLimit}
      - Core__RateLimiting__Window=${Core__RateLimiting__Window}
      - Core__RateLimiting__QueueLimit=${Core__RateLimiting__QueueLimit}

      # Connection Strings (Mapped to your Extension Methods)
      - ConnectionStrings__ManagementConnection=${ConnectionStrings__ManagementConnection:?ConnectionStrings__ManagementConnection must be set}
      - PostgreSqlConnections__MainPostgreSql__ConnectionString=${PostgreSqlConnections__MainPostgreSql__ConnectionString:?PostgreSqlConnections__MainPostgreSql__ConnectionString must be set}
      - RedisConnections__MainRedis__Host=${RedisConnections__MainRedis__Host}
      - RedisConnections__MainRedis__Password=${RedisConnections__MainRedis__Password}
      - RedisConnections__MainRedis__Database=${RedisConnections__MainRedis__Database}
      - RedisConnections__MainRedis__Ssl=${RedisConnections__MainRedis__Ssl}

      - Core__Idempotency__AllowedMethods__0=POST
      - Core__Idempotency__AllowedMethods__1=PUT
      - Core__Idempotency__AllowedMethods__2=DELETE
    ports:
      - "5186:8080"
    networks:
      - otel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      redis:
        condition: service_healthy

  otel-collector:
    container_name: core-otel-collector
    build:
      context: .
      dockerfile: Dockerfile.healthcheck
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:0.160.0@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    volumes:
      - ./otel-collector-config.yml:/etc/otel-col/config.yml
    command: ["--config=/etc/otel-col/config.yml"]
    ports:
      - "4317:4317"
      - "8889:8889"
    networks:
      - otel-network
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  jaeger:
    container_name: core-jaeger
    build:
      context: .
      dockerfile: Dockerfile.healthcheck
      args:
        BASE_IMAGE: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "16686:16686"
    networks:
      - otel-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    container_name: core-prometheus
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2d995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - otel-network
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    container_name: core-grafana
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - otel-network
    depends_on:
      jaeger:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  postgres_data:
    driver: local

networks:
  otel-network:
    driver: bridge
