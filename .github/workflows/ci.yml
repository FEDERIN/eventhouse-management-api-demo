name: CI Build & Test

# Trigger the workflow on push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test and Docker Validation
    runs-on: ubuntu-latest

    steps:
    # Check out the repository code to the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # Setup the .NET SDK version 8.0
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Restore NuGet packages
    - name: Restore Dependencies
      run: dotnet restore EventHouse.sln

    # Build the project in Release mode without re-restoring
    - name: Build Solution
      run: dotnet build EventHouse.sln --configuration Release --no-restore

    # Run Unit and Integration tests with Coverage
    - name: Run Tests
      run: |
        dotnet test EventHouse.sln \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --settings coverlet.runsettings \
          --collect:"XPlat Code Coverage"

    # Generate Coverage Report
    - name: Generate Coverage Report
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool
        reportgenerator -reports:"**/**/coverage.cobertura.xml" -targetdir:"coverage" -reporttypes:Html

    # Upload Coverage Artifact
    - name: Upload Coverage Artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    # Validate that the Dockerfile builds correctly (Smoke Test)
    - name: Build Docker Image
      run: docker build -t eventhouse-api:test -f src/EventHouse.Management.Api/Dockerfile .
